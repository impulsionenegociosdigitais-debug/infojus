# Configuração para publicar o painel no Render (https://render.com).
services:
  - type: web
    name: infojus-dashboard
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADVBOX_API_TOKEN
        sync: false
      - key: DASHBOARD_USERS
        sync: false
